
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <title>Painel da Loja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <h2>MINHA LOJA</h2>
    <nav>

  <main class="content">

        <p id="products">0</p>

      <div class="card">

        <p>0</p>

      <div class="card">
        <h3>Clientes</h3>
        <p>0</p>
      </div>
    </section>

    <section class="welcome">
      <h2>Bem-vindo à sua loja!</h2>
      <p>Seu painel administrativo está sendo configurado.</p>
    </section>
  </main>

  <script src="app.js"></script>

</html>
